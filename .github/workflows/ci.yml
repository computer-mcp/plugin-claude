name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_package.py dist > package-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claude-plugin-${{ github.sha }}-${{ matrix.python-version }}
          path: |
            dist/claude.zip
            package-receipt.json
          if-no-files-found: error
  unsupported-runtime:
    runs-on: macos-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 tests/check_runtime_rejection.py
  runtime:
    uses: computer-mcp/github-workflows/.github/workflows/plugin-runtime.yml@fd25fcface41732fda099017c6945912366fc7c1
  host-consumer:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Verify the registered print consumer against pinned Host source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /usr/bin/false
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_ALLOW_PROTOCOL: file:https
        run: |
          host_sha=$(cat .github/computer-mcp-host.sha)
          [[ "$host_sha" =~ ^[0-9a-f]{40}$ && "$host_sha" != 0000000000000000000000000000000000000000 ]]
          plugin_sha=$(git rev-parse HEAD)
          host_source="$RUNNER_TEMP/computer-mcp-host"
          git init "$host_source"
          git -C "$host_source" -c credential.helper= fetch --no-tags --depth=1 \
            https://github.com/computer-mcp/computer-mcp.git "$host_sha"
          git -C "$host_source" checkout --detach "$host_sha"
          test "$(git -C "$host_source" rev-parse HEAD)" = "$host_sha"
          python3 -B scripts/validate_host.py --suite registered-print \
            --host-source "$host_source" --host-sha "$host_sha" \
            --plugin-source "$PWD" --plugin-sha "$plugin_sha" \
            --output "$RUNNER_TEMP/claude-registered-print" --timeout 1200
      - name: Retain registered print evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claude-host-consumer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/claude-registered-print/receipt.json
            ${{ runner.temp }}/claude-registered-print/cases.json
            ${{ runner.temp }}/claude-registered-print/*-export.log
            ${{ runner.temp }}/claude-registered-print/package-build.log
            ${{ runner.temp }}/claude-registered-print/swift-test.log
          if-no-files-found: ignore
          retention-days: 14
  validate:
    if: always()
    needs: [package, unsupported-runtime, runtime, host-consumer]
    uses: computer-mcp/github-workflows/.github/workflows/result.yml@fd25fcface41732fda099017c6945912366fc7c1
    with:
      needs-json: ${{ toJSON(needs) }}
