id = "claude"
name = "Claude Code"
version = "0.1.0"
description = "Claude Code headless CLI automation plus a streaming CLI-to-MCP adapter."

[[dependencies]]
id = "claude-code"
commands = ["claude"]
instructions = "Install and authenticate Claude Code separately. This plugin never installs, updates, logs in, creates setup tokens, or copies Claude credentials."
documentation = "https://docs.anthropic.com/en/docs/claude-code/cli-reference"

[[dependencies]]
id = "python-runtime"
commands = ["python3"]
instructions = "Provide Python 3.11 or newer on the Computer MCP launch PATH. The plugin does not install Python."
documentation = "https://www.python.org/downloads/"

[[cli]]
id = "claude"
executable = { dependency = "claude-code" }
description = "Verified non-interactive Claude Code CLI surface."
tree = { kind = "file", path = "cli-tree.json" }

[[mcp]]
id = "stream"
transport = "stdio"
executable = { path = "bin/claude-mcp-adapter" }
prefix = "claude"
capabilities = ["tools"]

[[skills]]
id = "claude-code"
path = "skills/claude-code"
description = "Guidance for choosing Claude Code CLI and streaming MCP tools safely."

[compatibility]
minimum_host = "1.2.2"
architectures = ["arm64"]
